name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Clean up disk space
        run: |
          sudo apt-get clean
          pip cache purge
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android 2>/dev/null || true

      - name: Install system libs for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir flake8 pytest pytest-timeout
          # PyTorch CPU
          pip install --no-cache-dir \
            torch==2.5.1 torchvision==0.20.1 torchaudio==2.5.1 \
            --index-url https://download.pytorch.org/whl/cpu
          # Остальные зависимости (без torch*)
          if [ -f requirements-ci.txt ]; then
            pip install --no-cache-dir -r requirements-ci.txt
          fi

      - name: Download NLTK data
        run: |
          python -m nltk.downloader punkt stopwords

      - name: Show torch versions
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          mods = ('torch','torchvision','torchaudio')
          for n in mods:
              try:
                  spec = importlib.util.find_spec(n)
                  if spec is None:
                      print(n, 'N/A')
                      continue
                  m = __import__(n)
                  print(n, getattr(m, '__version__', '<no __version__>'))
              except Exception as e:
                  print(n, 'IMPORT-ERROR:', e)
          PY

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Prepare cache dirs
        run: |
          echo "HF_HOME=${{ runner.temp }}/hf-cache" >> $GITHUB_ENV
          echo "XDG_CACHE_HOME=${{ runner.temp }}/xdg-cache" >> $GITHUB_ENV
          echo "U2NET_HOME=${{ runner.temp }}/u2net" >> $GITHUB_ENV

      - name: Cache ML models
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.HF_HOME }}
            ${{ env.XDG_CACHE_HOME }}
            ${{ env.U2NET_HOME }}
          key: models-${{ runner.os }}-${{ hashFiles('requirements-ci.txt') }}

      - name: Warm up rembg model
        run: |
          python - <<'PY'
          from PIL import Image
          import rembg, pathlib
          p = pathlib.Path("warm.png"); Image.new("RGB",(16,16),(127,127,127)).save(p)
          with open(p, "rb") as f: rembg.remove(f.read())
          print("Warmup OK")
          PY

      - name: Test with pytest (fast)
        env:
          QT_QPA_PLATFORM: offscreen
          HF_HUB_ENABLE_HF_TRANSFER: "0"
        run: pytest -m "not slow" -q
