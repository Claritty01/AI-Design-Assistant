name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Clean up disk space
        run: |
          sudo apt-get clean
          pip cache purge
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android 2>/dev/null || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir flake8 pytest

          # Устанавливаем PyTorch CPU совместимых версий
          pip install --no-cache-dir \
            torch==2.5.1 torchvision==0.20.1 torchaudio==2.5.1 \
            --index-url https://download.pytorch.org/whl/cpu

          # Остальные зависимости (желательно убрать torch/vision/audio из requirements-ci.txt)
          if [ -f requirements-ci.txt ]; then
            pip install --no-cache-dir -r requirements-ci.txt
          fi

      - name: Show torch versions
        run: |
          python -c "import importlib, importlib.util, sys; \
mods=('torch','torchvision','torchaudio'); \
def ok(n): \
    return importlib.util.find_spec(n) is not None
for n in mods:
    try:
        if ok(n):
            m=__import__(n)
            print(n, getattr(m,'__version__','<no __version__>'))
        else:
            print(n, 'N/A')
    except Exception as e:
        print(n, 'IMPORT-ERROR:', e)"

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: pytest -q
