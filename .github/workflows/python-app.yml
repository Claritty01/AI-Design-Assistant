# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    
    - name: Clean up disk space
      run: |
        sudo apt-get clean
        pip cache purge
        sudo rm -rf /usr/share/dotnet 2>/dev/null || true
        sudo rm -rf /opt/ghc 2>/dev/null || true
        sudo rm -rf /usr/local/lib/android 2>/dev/null || true
        sudo rm -rf /opt/hostedtoolcache/Python/3.13.* 2>/dev/null || true
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir flake8 pytest
        
        # Install heavy packages separately with cache clearing
        if [ -f requirements.txt ]; then 
          echo "Installing PyTorch first..."
          pip install --no-cache-dir torch==2.5.1 torchvision==0.20.1 torchaudio==2.5.1
          pip cache purge
          
          echo "Installing OpenCV..."
          pip install --no-cache-dir opencv-python-headless==4.11.0.86
          pip cache purge
          
          echo "Installing other dependencies..."
          pip install --no-cache-dir -r requirements.txt
        fi
    
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test with pytest
      run: |
        pytest
